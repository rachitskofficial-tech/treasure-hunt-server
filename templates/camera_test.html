{% extends 'base.html' %}{% block content %}
<style>
.scanner{max-width:820px;margin:28px auto;padding:20px;text-align:center}.scanner h1{font-size:clamp(30px,7vw,52px);margin:0 0 8px}.scanner p{color:#9aa7bf;line-height:1.55}.viewport{position:relative;width:100%;aspect-ratio:4/3;background:#050810;border:1px solid #27324b;border-radius:20px;overflow:hidden;margin:18px 0}.viewport video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;left:50%;top:50%;width:min(68vw,300px);height:min(68vw,300px);max-height:55%;max-width:55%;transform:translate(-50%,-50%);border:3px solid #7df2bd;border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}.status{padding:13px;border-radius:14px;background:#111a2c;border:1px solid #27324b;color:#dce5f5;font-weight:700}.status.ok{background:#10251c;border-color:#24513e;color:#7df2bd}.status.bad{background:#2b1318;border-color:#6b2e3a;color:#ffb0bd}.btn{display:inline-block;margin-top:14px;padding:13px 18px;border-radius:12px;background:#edf5ff;color:#0a1020;text-decoration:none;font-weight:900;border:0;cursor:pointer;width:100%;box-sizing:border-box}.details{margin-top:12px;text-align:left;font-family:monospace;font-size:12px;white-space:pre-wrap;color:#aab6cc}.result{margin-top:14px;padding:14px;border-radius:14px;background:#0d1324;border:1px solid #27324b;text-align:left;word-break:break-word}.result strong{color:#7df2bd}.hidden{display:none}
</style>
<div class="scanner"><div class="eyebrow">NIKSHEPA QR Scanner</div><h1>📷 Scan QR Code</h1><p>Allow camera access, point the rear camera at a QR code and keep the code inside the frame.</p><div class="viewport"><video id="preview" autoplay playsinline muted></video><div class="frame"></div></div><div id="status" class="status">Ready. Press <strong>Start Scanner</strong>.</div><button id="start" class="btn">Start Scanner</button><button id="stop" class="btn hidden">Stop Scanner</button><div id="result" class="result hidden"></div><div id="details" class="details"></div></div>
<script>
const video=document.getElementById('preview'),status=document.getElementById('status'),details=document.getElementById('details'),start=document.getElementById('start'),stopBtn=document.getElementById('stop'),result=document.getElementById('result');
let stream=null, detector=null, scanning=false, locked=false;
function stop(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;start.classList.remove('hidden');stopBtn.classList.add('hidden');}
function esc(text){return String(text||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function recordAndNavigate(rawValue){
  status.className='status';status.textContent='⏳ QR detected. Recording scan…';
  try{
    const response=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({url:rawValue,rawValue:rawValue})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok||!data.ok) throw new Error(data.error||'SCAN_RECORD_FAILED');
    result.classList.remove('hidden');
    result.innerHTML='<strong>✅ SCAN RECORDED</strong><br>Team '+esc(data.team_number)+' · '+esc(data.temp_id||'Temporary ID unavailable')+'<br><small>Opening destination…</small>';
    status.className='status ok';status.textContent='✅ Scan recorded. Opening QR destination…';
    stop();
    setTimeout(()=>{window.location.assign(data.target_url||rawValue);},180);
  }catch(error){
    locked=false;status.className='status bad';status.textContent='🔴 Scan was not recorded';details.textContent='Error: '+(error.message||String(error))+'\nThe QR was NOT opened so the event record is not lost.';start.disabled=false;scanning=false;
  }
}
function showResult(text){locked=true;recordAndNavigate(text);}
async function loop(){if(!scanning||locked)return;try{const codes=await detector.detect(video);if(codes&&codes.length){const value=codes[0].rawValue||'';if(value)showResult(value);return;}}catch(e){}requestAnimationFrame(loop);}
async function startScanner(){locked=false;result.classList.add('hidden');details.textContent='';status.className='status';status.textContent='Requesting camera permission…';start.disabled=true;try{if(!window.isSecureContext)throw new Error('Camera requires HTTPS.');if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera API unavailable.');if(!('BarcodeDetector' in window))throw new Error('QR_DECODER_UNAVAILABLE: This browser does not provide native QR detection.');const supported=await BarcodeDetector.getSupportedFormats();if(!supported.includes('qr_code'))throw new Error('QR_DECODER_UNAVAILABLE: QR format is not supported on this browser.');detector=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();const track=stream.getVideoTracks()[0],settings=track.getSettings?track.getSettings():{};details.textContent='Camera: '+(track.label||'Rear camera')+'\nResolution: '+(settings.width||'?')+' × '+(settings.height||'?')+'\nQR engine: Native BarcodeDetector';scanning=true;start.classList.add('hidden');stopBtn.classList.remove('hidden');status.className='status ok';status.textContent='🟢 Scanner active. Point at a QR code.';requestAnimationFrame(loop);}catch(error){status.className='status bad';status.textContent='🔴 Scanner could not start';details.textContent='Error: '+(error.name||'Unknown')+'\nMessage: '+(error.message||String(error));start.disabled=false;}}
start.addEventListener('click',startScanner);stopBtn.addEventListener('click',()=>{locked=false;stop();start.disabled=false;status.className='status';status.textContent='Scanner stopped. Press Start Scanner to try again.'});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('beforeunload',stop);
</script>
{% endblock %}
