{% extends 'base.html' %}{% block content %}
<style>
.camera-test{max-width:760px;margin:40px auto;padding:24px;text-align:center}.camera-test h1{font-size:clamp(32px,7vw,52px);margin:0 0 10px}.camera-test p{color:#9aa7bf;line-height:1.6}.test-video{width:100%;aspect-ratio:4/3;background:#050810;border:1px solid #27324b;border-radius:20px;object-fit:cover;margin:18px 0}.status{padding:14px;border-radius:14px;background:#111a2c;border:1px solid #27324b;color:#dce5f5;font-weight:700}.status.ok{background:#10251c;border-color:#24513e;color:#7df2bd}.status.bad{background:#2b1318;border-color:#6b2e3a;color:#ffb0bd}.btn{display:inline-block;margin-top:14px;padding:13px 18px;border-radius:12px;background:#edf5ff;color:#0a1020;text-decoration:none;font-weight:900;border:0;cursor:pointer}.details{margin-top:14px;text-align:left;font-family:monospace;font-size:12px;white-space:pre-wrap;color:#aab6cc}
</style>
<div class="camera-test"><div class="eyebrow">Camera Diagnostic</div><h1>📷 Camera Test</h1><p>This page intentionally does not load the QR scanner. It only tests whether this browser can access the device camera.</p><video id="preview" class="test-video" autoplay playsinline muted></video><div id="status" class="status">Press <strong>Test Camera</strong> and allow camera access.</div><button id="test" class="btn">Test Camera</button><div id="details" class="details"></div></div>
<script>
const video=document.getElementById('preview'),status=document.getElementById('status'),details=document.getElementById('details'),button=document.getElementById('test');let stream=null;
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;}
async function testCamera(){stop();status.className='status';status.textContent='Requesting camera permission…';details.textContent='';button.disabled=true;try{if(!window.isSecureContext)throw new Error('INSECURE_CONTEXT: Camera requires HTTPS.');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('GET_USER_MEDIA_UNAVAILABLE: This browser does not expose camera access.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();const tracks=stream.getVideoTracks();const track=tracks[0];const settings=track.getSettings?track.getSettings():{};status.className='status ok';status.textContent='🟢 CAMERA WORKS';details.textContent='Camera: '+(track.label||'Unknown')+'\nDevice ID: '+(settings.deviceId||'available')+'\nFacing mode: '+(settings.facingMode||'not reported')+'\nResolution: '+(settings.width||'?')+' × '+(settings.height||'?')+'\nSecure context: '+window.isSecureContext;button.textContent='Camera Working';}catch(error){status.className='status bad';status.textContent='🔴 CAMERA ACCESS FAILED';details.textContent='Error: '+(error.name||'Unknown')+'\nMessage: '+(error.message||String(error))+'\nSecure context: '+window.isSecureContext+'\nMediaDevices available: '+Boolean(navigator.mediaDevices)+'\ngetUserMedia available: '+Boolean(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);button.disabled=false;button.textContent='Try Again';}}
button.addEventListener('click',testCamera);window.addEventListener('beforeunload',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
</script>
{% endblock %}
