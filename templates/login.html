{% extends 'base.html' %}{% block content %}
<h1>Admin</h1><p>Enter the dashboard password.</p>
<form method="post">
  <div class="password-wrap" style="display:flex;gap:8px;align-items:center">
    <input id="admin-password" class="input" style="flex:1" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" type="button" id="toggle-password" aria-label="Show password" aria-pressed="false">Show</button>
  </div>
  <button class="btn" type="submit" style="margin-top:12px">Open dashboard</button>
</form>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<script>
const passwordInput = document.getElementById('admin-password');
const toggleButton = document.getElementById('toggle-password');

toggleButton.addEventListener('click', () => {
  const visible = passwordInput.type === 'text';
  passwordInput.type = visible ? 'password' : 'text';
  toggleButton.textContent = visible ? 'Show' : 'Hide';
  toggleButton.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
  toggleButton.setAttribute('aria-pressed', String(!visible));
});
</script>
{% endblock %}
